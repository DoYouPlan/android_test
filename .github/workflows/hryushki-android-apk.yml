name: Build and verify Hryushki Accounts Android 2
on:
  push:
    branches: [hryushki-accounts]
    paths: ['hryushki/**', '.github/workflows/hryushki-android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile application and device tests
        run: gradle -p hryushki :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp hryushki/app/build/outputs/apk/debug/app-debug.apk dist/Hryushki_Accounts_Android_2.0-debug.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify accounting, UI and persistence on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash hryushki/verify-device.sh
      - name: Upload APK and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hryushki-Accounts-Android-2
          path: dist/
          if-no-files-found: error
          retention-days: 30

name: Hryushki sync test builds and contract checks
on:
  push:
    branches: [hryushki-accounts]
    paths: ['sync/**','syncwindows/**','syncandroid/**','.github/workflows/hryushki-sync-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: integration-test-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: SQL schema and security contract
        run: |
          psql -v ON_ERROR_STOP=1 -f sync/sql/test_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f sync/sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -f sync/sql/test_server.sql
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify Windows
        shell: powershell
        run: |
          & syncwindows/build.ps1
          $exe = Resolve-Path syncwindows/dist/Hryushki_Accounts.exe
          foreach ($arg in @('--self-test','--sync-test')) {
            $p = Start-Process $exe -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Failed $arg" }
          }
          '{"version":2,"warehouses":["Дома","Зверёк Аморе"],"operations":[],"products":[],"materials":[]}' | Set-Content -Encoding UTF8 syncwindows/ui-test.json
          $data = Resolve-Path syncwindows/ui-test.json
          $image = Join-Path (Resolve-Path syncwindows/dist) 'preview.png'
          $p = Start-Process $exe -ArgumentList @('--ui-test', $data, $image) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'UI failed' }
          Copy-Item $exe syncwindows/dist/Hryushki_Accounts_Sync_Test.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Sync-Test-Windows
          path: syncwindows/dist/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android
        run: gradle -p syncandroid :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p sync-dist
          cp syncandroid/app/build/outputs/apk/debug/app-debug.apk sync-dist/Hryushki_Accounts_Sync_Test-ci.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" sync-dist/apksigner.jar
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash sync/verify-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sync-Test-Android
          path: sync-dist/

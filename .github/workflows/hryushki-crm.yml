name: Hryushki Clients and Orders Android
on:
  push:
    branches: [hryushki-accounts]
    paths: ['crm/**', '.github/workflows/hryushki-crm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APKs
        run: gradle -p crm :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - name: Prepare build
        run: |
          mkdir -p crm-dist
          cp crm/app/build/outputs/apk/release/app-release.apk crm-dist/Hryushki_Clients_Orders_1.0-ci.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" crm-dist/apksigner.jar
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash crm/verify-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hryushki-Clients-Orders-1
          path: crm-dist/
          if-no-files-found: error
          retention-days: 30
